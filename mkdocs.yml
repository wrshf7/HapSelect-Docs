site_name: HapSelect
site_description: Haplotype block discovery, localGEBV analysis, and parent selection for genomic selection in R
site_url: https://wrshf7.github.io/HapSelect-Docs/
repo_url: https://github.com/wrshf7/HapSelect
repo_name: HapSelect

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/theme-light-dark
        name: Following system theme - switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode - switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode - switch to system theme
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: "1-2"


extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Overview: overview.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Progress Reporting: progress.md
  - Getting Started: getting-started.md
  - Workflow:
    - Complete Workflow with Explanations: workflow/example_workflow.md
    - Complete Workflow with Minimal Explanation: workflow/example_workflow_minimal_comments.md
    - Specific Sections:
        - Data Import and Imputation: workflow/data-import.md
        - Pairwise LD: workflow/pairwise-ld.md
        - Haplotype Blocks: workflow/haploblocks.md
        - Marker Effects: workflow/marker-effects.md
        - LocalGEBV and Haplotype Effects: workflow/local-gebv.md
        - Visualisations: workflow/visualizations.md
        - Parent Selection: workflow/parent-selection.md
        - Basic Simulation: workflow/basic-simulation.md
  - Function Reference: reference.md

extra:
  version:
    provider: mike